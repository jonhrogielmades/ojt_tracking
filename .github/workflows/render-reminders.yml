name: Render daily student reminders

on:
  schedule:
    # 10:00 UTC is 18:00 in Asia/Manila throughout the year.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-daily-student-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    name: Wake Render and send reminders
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
      RENDER_CRON_SECRET: ${{ secrets.RENDER_CRON_SECRET }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${RENDER_APP_URL}" ]]; then
            echo "::error::Repository secret RENDER_APP_URL is not configured."
            exit 1
          fi

          if [[ "${RENDER_APP_URL}" != https://* ]]; then
            echo "::error::RENDER_APP_URL must start with https://."
            exit 1
          fi

          if [[ -z "${RENDER_CRON_SECRET}" ]]; then
            echo "::error::Repository secret RENDER_CRON_SECRET is not configured."
            exit 1
          fi

          if (( ${#RENDER_CRON_SECRET} < 32 )); then
            echo "::error::RENDER_CRON_SECRET must contain at least 32 characters."
            exit 1
          fi

      - name: Invoke protected reminder endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          base_url="${RENDER_APP_URL%/}"

          curl \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "X-Render-Cron-Secret: ${RENDER_CRON_SECRET}" \
            --data '{}' \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 20 \
            --retry-max-time 600 \
            --connect-timeout 20 \
            --max-time 180 \
            "${base_url}/internal/render/reminders"
